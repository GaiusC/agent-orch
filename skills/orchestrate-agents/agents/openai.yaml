interface:
  display_name: "Agent Orch"
  short_description: "Hand off tasks, review changes and close Git work safely"
  default_prompt: "Use $orchestrate-agents to audit the original project, recommend models and task branches, explicitly hand off tasks, independently review changes, and commit, merge and safely retire bounded workspaces while preserving unrelated work."

dependencies:
  tools:
    - type: "mcp"
      value: "agent_orch"
      description: "Task ownership and handoff, recommended branches and routes, independent review, recoverable delivery and shared workspace limits"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
