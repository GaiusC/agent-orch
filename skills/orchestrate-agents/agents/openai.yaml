interface:
  display_name: "Agent Orch"
  short_description: "Bind project identity, share limits and finalize reviewed work"
  default_prompt: "Use $orchestrate-agents to audit and bind the original project, recommend model routes, supervise bounded workers and independent review, and finalize exact Git commits while preserving unrelated work."

dependencies:
  tools:
    - type: "mcp"
      value: "agent_orch"
      description: "Runtime project identity, shared workspace limits, recommended routes, bounded Worker upgrades, quota-only review fallback and exact Git finalization"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
