interface:
  display_name: "Agent Orch"
  short_description: "Review environments, commit tasks, and retire worktrees safely"
  default_prompt: "Use $orchestrate-agents to audit inherited environments, preserve unknown changes, select model routes and Git policies, and persist the plan. Supervise short checkpoint events with wait-for-job, independently review and accept work or integrated parallel results, then finalize exact local commits and safe worktree retirement with durable receipts."

dependencies:
  tools:
    - type: "mcp"
      value: "agent_orch"
      description: "Environment audits, concise events, reviewed integration, exact Git commits, and safe retirement"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
